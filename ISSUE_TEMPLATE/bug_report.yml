name: Bug report
description: Report a reproducible problem
title: '[Bug]: '
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and expected behaviour
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps and environment
      description: Do not include secrets or personal data.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitised evidence or screenshots
