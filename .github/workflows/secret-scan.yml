name: CTDG secret security scan
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          version=8.30.1
          asset="gitleaks_${version}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location "$base/$asset" -o "$asset"
          curl --fail --silent --show-error --location "$base/gitleaks_${version}_checksums.txt" -o checksums.txt
          grep -F "  $asset" checksums.txt | sha256sum --check
          tar -xzf "$asset" gitleaks
          chmod +x gitleaks
          ./gitleaks version
      - name: Scan Git history with redaction
        shell: bash
        run: |
          "$RUNNER_TEMP/gitleaks" git . --log-opts="--all" --redact=100 --no-banner
